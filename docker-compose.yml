services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payproof
      POSTGRES_PASSWORD: payproof
      POSTGRES_DB: payproof
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payproof"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
